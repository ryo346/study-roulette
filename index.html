<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【無駄な時間を無くす】国公立に受かるための勉強法ルーレット</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceIn {
      0%   { opacity: 0; transform: scale(0.72); }
      55%  { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      from { background-position: -200% center; }
      to   { background-position:  200% center; }
    }

    .anim-fade-up  { animation: fadeInUp 0.4s ease-out both; }
    .anim-slide-up { animation: slideUp  0.12s ease-out both; }
    .anim-bounce-in{ animation: bounceIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }

    .shimmer-text {
      background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 35%, #ec4899 65%, #3b82f6 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 0.45s linear infinite;
    }

    .tab-btn  { transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
    .spin-btn { transition: transform 0.15s, box-shadow 0.15s; }
    .spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
    .spin-btn:active:not(:disabled){ transform: scale(0.96); }
    .spin-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .result-card { transition: border-color 0.3s; }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">

  <!-- ───────────────────────── MAIN ───────────────────────── -->
  <div class="max-w-md mx-auto px-4 py-8 pb-20">

    <!-- Header -->
    <header class="text-center mb-8 anim-fade-up">
      <div class="text-5xl mb-3">📚</div>
      <p class="text-xs font-bold text-slate-400 tracking-widest uppercase mb-1">無駄な時間を無くす</p>
      <h1 class="text-xl font-black text-slate-800 tracking-tight leading-snug">国公立に受かるための<br>勉強法ルーレット</h1>
      <p class="text-slate-500 text-sm mt-2">今日やるべき内容をランダムに決めよう！</p>
    </header>

    <!-- Subject Tabs -->
    <div class="flex gap-2 mb-5 p-1.5 bg-white rounded-2xl shadow-sm border border-slate-100 anim-fade-up"
         style="animation-delay:.05s" id="subjectTabs">
      <button class="tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm"
              data-subject="英語" onclick="selectSubject('英語')">🇬🇧 英語</button>
      <button class="tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm"
              data-subject="数学" onclick="selectSubject('数学')">📐 数学</button>
      <button class="tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm"
              data-subject="国語" onclick="selectSubject('国語')">📖 国語</button>
    </div>

    <!-- Result Card -->
    <div id="resultCard"
         class="result-card bg-white rounded-2xl shadow-sm border-2 border-slate-100 p-6 mb-4 flex flex-col items-center justify-center text-center anim-fade-up"
         style="min-height:13rem; animation-delay:.1s">

      <!-- State: placeholder -->
      <div id="statePlaceholder">
        <div class="text-4xl mb-3">🎲</div>
        <p class="text-slate-400 text-sm font-medium leading-relaxed">
          科目を選んで<br>ルーレットを回してみよう！
        </p>
      </div>

      <!-- State: spinning -->
      <div id="stateSpinning" class="hidden">
        <p class="text-xs font-semibold text-slate-400 tracking-widest mb-4 uppercase">ルーレット中…</p>
        <p id="spinBook"  class="text-2xl font-black shimmer-text leading-snug">---</p>
        <p id="spinGenre" class="text-xs text-slate-400 mt-2 font-medium"></p>
      </div>

      <!-- State: result -->
      <div id="stateResult" class="hidden w-full">
        <p class="text-xs font-semibold text-slate-400 tracking-widest mb-3 uppercase">今日やること！</p>
        <div id="genreBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-3"></div>
        <p id="resultBook"    class="text-2xl font-black text-slate-800 leading-snug"></p>
        <p id="resultSubject" class="text-xs text-slate-400 mt-2 font-semibold tracking-wide"></p>
        <div id="adviceBox" class="mt-4 px-4 py-3 rounded-xl text-left">
          <p class="text-xs font-black mb-0.5">💡 ワンポイントアドバイス</p>
          <p id="resultAdvice" class="text-xs font-medium leading-relaxed"></p>
        </div>
      </div>

    </div>

    <!-- Spin Button -->
    <button id="spinBtn"
            class="spin-btn w-full py-4 rounded-2xl text-white font-black text-lg shadow-lg mb-7 bg-slate-400 anim-fade-up"
            style="animation-delay:.15s"
            onclick="spin()">
      🎲 ルーレットを回す
    </button>

    <!-- History -->
    <div id="historySection" class="hidden">
      <div class="flex items-center gap-3 mb-3">
        <div class="h-px flex-1 bg-slate-200"></div>
        <p class="text-xs font-semibold text-slate-400 tracking-widest uppercase shrink-0">最近の結果</p>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>
      <div id="historyList" class="space-y-2"></div>
    </div>

  </div><!-- /main -->

  <!-- Tailwind safelist (動的クラスを確実に生成させる hidden div) -->
  <div class="hidden
    bg-blue-500    border-blue-200    bg-blue-100    text-blue-700    text-blue-600    bg-blue-50    border-blue-100
    bg-emerald-500 border-emerald-200 bg-emerald-100 text-emerald-700 text-emerald-600 bg-emerald-50 border-emerald-100
    bg-rose-500    border-rose-200    bg-rose-100    text-rose-700    text-rose-600    bg-rose-50    border-rose-100
  "></div>
  <!-- advice color safelist -->
  <div class="hidden bg-blue-50 text-blue-700 bg-emerald-50 text-emerald-700 bg-rose-50 text-rose-700"></div>

  <!-- ───────────────────────── SCRIPT ───────────────────────── -->
  <script>
  // ── Data ──────────────────────────────────────────────────────
  const DATA = {
    英語: [
      { genre: "単語・熟語", book: "鉄壁",
        advice: "旧帝大・難関国公立を狙うなら鉄壁が最強。語源・語義を深く理解することで長文での語彙力が圧倒的になる！" },
      { genre: "単語・熟語", book: "システム英単語",
        advice: "共通テストから国公立二次まで対応。第4章まで完璧にすれば語彙力の土台は完成。夜寝る前の反復が鍵！" },
      { genre: "単語・熟語", book: "速読英単語 上級編",
        advice: "国公立二次の長文レベルに対応した良質な英文集。読みながら難単語を習得できる一石二鳥の1冊！" },
      { genre: "英文法",     book: "Vintage",
        advice: "国公立二次で問われる文法・語法の総まとめに最適。解説を読み込んで「なぜ」まで理解しよう" },
      { genre: "英文法",     book: "英文法ポラリス2",
        advice: "国公立標準レベルの文法問題を体系的に学べる。問題量も適切で完璧に仕上げやすい1冊！" },
      { genre: "英文解釈",   book: "ポレポレ英文読解プロセス50",
        advice: "国公立二次の英文解釈の定番。思考プロセスを丁寧に追うことで、難構文を自力で読み解く力がつく！" },
      { genre: "英文解釈",   book: "英文解釈の技術100",
        advice: "100題をこなすことで構文把握力が飛躍的に伸びる。1日3〜5題ずつ丁寧に取り組もう" },
      { genre: "英文解釈",   book: "透視図",
        advice: "難関国公立の英文解釈対策の最高峰。東大・京大志望者は必携。1周目は分からなくて当然、解説を熟読しよう" },
      { genre: "英作文",     book: "大矢英作文講義の実況中継",
        advice: "国公立必須の和文英訳を基礎から丁寧に学べる。「日本語をシンプルな英語に変換する」思考が身につく！" },
      { genre: "英作文",     book: "英作文ハイパートレーニング（自由英作文編）",
        advice: "自由英作文は型の習得が9割。模範解答を丸暗記するくらいの気持ちで取り組もう！" },
      { genre: "長文読解",   book: "やっておきたい英語長文700",
        advice: "国公立二次レベルの良質な長文が揃っている。時間を計って本番と同じ条件で解き、徹底復習しよう" },
      { genre: "長文読解",   book: "英語長文ポラリス3",
        advice: "最難関国公立レベルの長文対策に最適。根拠を明確にしながら解く訓練が二次試験突破の鍵！" },
    ],
    数学: [
      { genre: "網羅系演習", book: "青チャート",
        advice: "国公立合格者のほぼ全員が通る道。例題だけで構わないので、解法パターンを完全に体得するまで何周もしよう" },
      { genre: "網羅系演習", book: "Focus Gold",
        advice: "青チャートより解説が丁寧で網羅性も高い。マスター編の例題を完璧にすれば国公立標準レベルは突破できる！" },
      { genre: "標準問題演習", book: "一対一対応の演習",
        advice: "国公立二次で問われる問題の「型」を学ぶ最強の1冊。解説の思考の流れを体に覚えさせることが最重要！" },
      { genre: "標準問題演習", book: "標準問題精講",
        advice: "国公立二次レベルの標準的な問題が揃っている。精講のコメントを読み込むことで本質的な理解が深まる！" },
      { genre: "実戦演習（文系）", book: "文系数学の良問プラチカ",
        advice: "文系国公立二次数学の王道。難しく感じたら一対一に戻るサイン。焦らず実力を積み上げよう" },
      { genre: "実戦演習（文系）", book: "文系数学 入試の核心",
        advice: "文系国公立二次の頻出テーマを効率よく学べる。解説が丁寧なので独学でもこなしやすい1冊！" },
      { genre: "実戦演習（理系）", book: "理系数学の良問プラチカ",
        advice: "理系国公立二次で差をつけるための1冊。IA・IIBとIIIは分けて計画的に進めよう" },
      { genre: "実戦演習（理系）", book: "やさしい理系数学",
        advice: "タイトルに反して難しいが、思考力を鍛える良問が揃っている。自力で考える時間を大切にしよう！" },
    ],
    国語: [
      { genre: "現代文・記述対策", book: "得点奪取現代文",
        advice: "国公立記述の採点基準に合わせた解答作成の技術が身につく。「何を書けば点がもらえるか」を徹底的に学ぼう！" },
      { genre: "現代文・記述対策", book: "現代文読解力の開発講座",
        advice: "論理的な文章読解の方法論を根本から鍛えてくれる名著。読み切れば現代文の見え方が変わる1冊！" },
      { genre: "現代文",           book: "入試現代文へのアクセス 発展編",
        advice: "国公立二次レベルの現代文読解に対応。解説を熟読して「なぜその答えになるか」の論理を追おう" },
      { genre: "古文",             book: "古文解釈の方法",
        advice: "古文を日本語として読む力を根本から鍛えてくれる名著。文法知識を実際の読解につなげる架け橋になる！" },
      { genre: "古文",             book: "古文上達 基礎編",
        advice: "読解問題を通じて文法・単語・解釈力を同時に強化できる。国公立の古文記述にも対応した実戦的な1冊！" },
      { genre: "古文",             book: "読んで見て覚える古文単語315",
        advice: "国公立に必要な古文単語を効率よく網羅できる。夜寝る前の反復が定着の近道！" },
      { genre: "漢文",             book: "得点奪取漢文",
        advice: "国公立記述漢文の解答作成に特化した1冊。句法の知識を「書く力」に変える練習を積もう！" },
      { genre: "漢文",             book: "漢文道場",
        advice: "句法から読解まで段階的に力がつく構成。書き下し文を声に出して読むと理解が格段に深まる！" },
    ],
  };

  // ── Colors ────────────────────────────────────────────────────
  const COLORS = {
    英語: {
      tabActive:  'bg-blue-500 text-white shadow-md',
      btnBg:      'bg-blue-500',
      cardBorder: 'border-blue-200',
      badge:      'bg-blue-100 text-blue-700',
      adviceBg:   'bg-blue-50',
      adviceText: 'text-blue-700',
      histBorder: 'border-blue-100',
      histTag:    'bg-blue-500 text-white',
      histGenre:  'text-blue-600',
    },
    数学: {
      tabActive:  'bg-emerald-500 text-white shadow-md',
      btnBg:      'bg-emerald-500',
      cardBorder: 'border-emerald-200',
      badge:      'bg-emerald-100 text-emerald-700',
      adviceBg:   'bg-emerald-50',
      adviceText: 'text-emerald-700',
      histBorder: 'border-emerald-100',
      histTag:    'bg-emerald-500 text-white',
      histGenre:  'text-emerald-600',
    },
    国語: {
      tabActive:  'bg-rose-500 text-white shadow-md',
      btnBg:      'bg-rose-500',
      cardBorder: 'border-rose-200',
      badge:      'bg-rose-100 text-rose-700',
      adviceBg:   'bg-rose-50',
      adviceText: 'text-rose-700',
      histBorder: 'border-rose-100',
      histTag:    'bg-rose-500 text-white',
      histGenre:  'text-rose-600',
    },
  };

  // ── State ────────────────────────────────────────────────────
  let currentSubject = null;
  let isSpinning     = false;
  let history        = [];

  // ── selectSubject ─────────────────────────────────────────────
  function selectSubject(subject) {
    if (isSpinning) return;
    currentSubject = subject;
    const c = COLORS[subject];

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.className = `tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm ${
        btn.dataset.subject === subject
          ? COLORS[btn.dataset.subject].tabActive
          : 'text-slate-500 hover:bg-slate-50'
      }`;
    });

    // Card border
    const card = document.getElementById('resultCard');
    card.className = card.className
      .replace(/border-\S+/g, '')
      .replace(/\s+/g, ' ')
      .trim() + ' ' + c.cardBorder;

    // Spin button
    const btn = document.getElementById('spinBtn');
    btn.className = `spin-btn w-full py-4 rounded-2xl text-white font-black text-lg shadow-lg mb-7 anim-fade-up ${c.btnBg}`;
    btn.style.animationDelay = '';

    // Reset to placeholder only if result isn't showing
    if (!document.getElementById('stateResult').classList.contains('hidden')) return;
    showState('placeholder');
  }

  // ── showState ─────────────────────────────────────────────────
  function showState(state) {
    document.getElementById('statePlaceholder').classList.toggle('hidden', state !== 'placeholder');
    document.getElementById('stateSpinning').classList.toggle('hidden',   state !== 'spinning');
    document.getElementById('stateResult').classList.toggle('hidden',     state !== 'result');
  }

  // ── spin ──────────────────────────────────────────────────────
  function spin() {
    if (!currentSubject || isSpinning) return;
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;

    const items     = DATA[currentSubject];
    const finalItem = items[Math.floor(Math.random() * items.length)];

    showState('spinning');

    const spinBook  = document.getElementById('spinBook');
    const spinGenre = document.getElementById('spinGenre');

    // Timing schedule: fast → gradually slower (ms between frames)
    const schedule = [
      50, 55, 55, 60, 60, 65, 68, 72, 78,
      95, 115, 145, 185, 240, 320, 430,
    ];

    let step = 0;

    function tick() {
      const item = items[Math.floor(Math.random() * items.length)];

      // Slide-up animation on each tick
      spinBook.classList.remove('anim-slide-up');
      void spinBook.offsetWidth;           // force reflow
      spinBook.textContent = item.book;
      spinBook.classList.add('anim-slide-up');
      spinGenre.textContent = item.genre;

      step++;
      if (step < schedule.length) {
        setTimeout(tick, schedule[step]);
      } else {
        setTimeout(() => showResult(finalItem), 320);
      }
    }

    tick();
  }

  // ── showResult ────────────────────────────────────────────────
  function showResult(item) {
    const c = COLORS[currentSubject];

    showState('result');

    const el = document.getElementById('stateResult');
    el.classList.remove('anim-bounce-in');
    void el.offsetWidth;
    el.classList.add('anim-bounce-in');

    document.getElementById('genreBadge').className =
      `inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 ${c.badge}`;
    document.getElementById('genreBadge').textContent   = item.genre;
    document.getElementById('resultBook').textContent    = item.book;
    document.getElementById('resultSubject').textContent = `— ${currentSubject} —`;
    document.getElementById('adviceBox').className =
      `mt-4 px-4 py-3 rounded-xl text-left ${c.adviceBg} ${c.adviceText}`;
    document.getElementById('resultAdvice').textContent  = item.advice;

    addToHistory(item);
    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;
  }

  // ── history ───────────────────────────────────────────────────
  function addToHistory(item) {
    history.unshift({ subject: currentSubject, ...item });
    if (history.length > 3) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list    = document.getElementById('historyList');

    if (history.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    list.innerHTML = history.map((h, i) => {
      const c = COLORS[h.subject];
      return `
        <div class="flex items-center gap-2 bg-white rounded-xl px-4 py-3 border ${c.histBorder} anim-fade-up"
             style="animation-delay:${i * 0.06}s">
          <span class="shrink-0 px-2 py-0.5 rounded-lg text-xs font-black ${c.histTag}">${h.subject}</span>
          <span class="text-xs font-semibold ${c.histGenre} shrink-0">${h.genre}</span>
          <span class="text-sm font-bold text-slate-700 ml-auto text-right leading-tight">${h.book}</span>
        </div>`;
    }).join('');
  }

  // ── Init ──────────────────────────────────────────────────────
  selectSubject('英語');
  </script>
</body>
</html>
